<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>✨ Study Glow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-0: #fff5fb;
            --bg-1: #ffeef8;
            --bg-2: #f3eeff;
            --card: #ffffff;
            --card-2: #fff8fe;
            --border: #ffd6ec;
            --text: #3d1e5c;
            --muted: #a17ab8;
            --pink: #ff5fa2;
            --coral: #ff8a5b;
            --yellow: #ffd23f;
            --mint: #4ee1a0;
            --sky: #4dc9ff;
            --lavender: #b57aff;
            --purple: #8b5cf6;
        }
        html, body {
            background: linear-gradient(135deg, #fff5fb 0%, #f3eeff 50%, #e8f7ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: 14px 12px 40px;
            display: flex; flex-direction: column; align-items: center;
        }
        /* soft blobs */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(255,95,162,0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(181,122,255,0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(77,201,255,0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        .app-header {
            position: relative; z-index: 1;
            width: 100%; max-width: 1100px;
            margin-bottom: 18px; text-align: center;
        }
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.4rem; font-weight: 700;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, var(--pink) 0%, var(--lavender) 50%, var(--sky) 100%);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 12px rgba(255,95,162,0.25));
            margin-bottom: 6px;
        }
        .subhead {
            font-size: 0.85rem; font-weight: 500; color: var(--muted);
            letter-spacing: 0.08em; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .subhead .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--mint);
            display: inline-block;
            box-shadow: 0 0 10px var(--mint);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* NAV */
        .page-nav {
            position: relative; z-index: 1;
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            margin-bottom: 22px; width: 100%; max-width: 1100px;
        }
        .nav-btn {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 10px 16px;
            font-size: 0.85rem; font-weight: 600;
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex; align-items: center; gap: 6px;
            letter-spacing: 0.02em;
            box-shadow: 0 3px 0 rgba(255,95,162,0.15);
        }
        .nav-btn:hover {
            border-color: var(--pink);
            transform: translateY(-2px);
            box-shadow: 0 5px 0 rgba(255,95,162,0.2);
        }
        .nav-btn.active {
            background: linear-gradient(135deg, var(--pink), var(--lavender));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 0 rgba(139,92,246,0.4);
        }
        .nav-btn.bank-btn {
            background: linear-gradient(135deg, #e0f7ff, #d4f4ff);
            border-color: #b8e8ff;
            color: #0a6b8a;
        }
        .nav-btn.bank-btn.active {
            background: linear-gradient(135deg, var(--sky), #2a9bc0);
            color: #fff;
            box-shadow: 0 4px 0 rgba(77,201,255,0.4);
        }

        .page-content {
            position: relative; z-index: 1;
            width: 100%; max-width: 1100px;
        }

        /* DAY PAGE */
        .day-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.1rem; font-weight: 700;
            text-align: center;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--pink), var(--coral));
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
        }
        .day-progress {
            text-align: center; font-size: 0.85rem; font-weight: 600;
            color: var(--muted); margin-bottom: 20px;
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .day-progress.complete {
            color: var(--mint);
            text-shadow: 0 0 12px rgba(78,225,160,0.4);
        }

        /* SUBJECT BLOCK */
        .subject-block {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 22px;
            padding: 16px;
            margin-bottom: 14px;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(255,95,162,0.08), 0 2px 12px rgba(181,122,255,0.08);
        }
        .subject-block:hover {
            border-color: var(--pink);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(255,95,162,0.12), 0 4px 16px rgba(181,122,255,0.12);
        }
        .subject-header {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px dashed var(--border);
        }
        .subject-name-display {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.25rem; font-weight: 600;
            color: var(--text);
            flex: 1;
            letter-spacing: -0.01em;
        }

        /* Buttons */
        .btn-icon {
            background: #fff0f8;
            border: 2px solid #ffd6ec;
            border-radius: 12px;
            width: 36px; height: 36px;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--pink);
            transition: all 0.15s ease;
            font-family: inherit;
            flex-shrink: 0;
        }
        .btn-icon:hover {
            background: var(--pink);
            color: #fff;
            border-color: var(--pink);
            transform: scale(1.08);
        }

        .btn-add-task {
            background: #e8fff4;
            border: 2px dashed var(--mint);
            border-radius: 14px;
            padding: 10px 16px;
            font-size: 0.88rem; font-weight: 600;
            color: #0a8055;
            cursor: pointer;
            margin-top: 12px;
            display: inline-flex; align-items: center; gap: 6px;
            font-family: inherit;
            transition: all 0.15s ease;
            letter-spacing: 0.02em;
        }
        .btn-add-task:hover {
            background: #d4ffe8;
            transform: translateY(-1px);
        }
        .btn-add-task:disabled {
            opacity: 0.4; cursor: not-allowed;
            border-style: solid;
            color: var(--muted);
            background: #f5f5f5;
            border-color: #ddd;
        }

        .btn-add-subject {
            background: linear-gradient(135deg, #ffe0f0, #f3e0ff);
            border: 2.5px dashed var(--pink);
            border-radius: 22px;
            padding: 22px;
            font-size: 1.05rem; font-weight: 700;
            color: var(--pink);
            cursor: pointer;
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.18s ease;
            margin-top: 8px;
            letter-spacing: 0.02em;
        }
        .btn-add-subject:hover {
            background: linear-gradient(135deg, #ffcce5, #e8d0ff);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255,95,162,0.25);
        }
        .btn-add-subject:active {
            transform: translateY(0);
        }

        /* TASK ITEMS */
        .task-list {
            display: flex; flex-direction: column; gap: 8px;
        }
        .task-item {
            display: flex; align-items: center; gap: 10px;
            background: var(--card-2);
            border-radius: 14px;
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            transition: all 0.15s ease;
        }
        .task-item:hover { border-color: var(--lavender); }
        .task-text-display {
            flex: 1;
            font-size: 0.93rem; font-weight: 500;
            color: var(--text);
            min-width: 0;
            word-break: break-word;
        }
        .task-item.done .task-text-display {
            color: var(--muted);
            text-decoration: line-through;
        }

        .task-check {
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 28px; height: 28px;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted);
            transition: all 0.15s ease;
            flex-shrink: 0;
            padding: 0; line-height: 1;
            font-family: inherit;
        }
        .task-check:hover {
            border-color: var(--mint);
            background: #e8fff4;
        }
        .task-check.done {
            background: var(--mint);
            border-color: var(--mint);
            color: #fff;
            box-shadow: 0 0 12px rgba(78,225,160,0.5);
        }

        .task-remove {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 1.1rem;
            cursor: pointer;
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            flex-shrink: 0;
            padding: 0; line-height: 1;
            font-family: inherit;
            transition: all 0.15s ease;
        }
        .task-remove:hover {
            background: #ffe0ec;
            color: var(--pink);
        }

        .empty-hint {
            font-size: 0.88rem;
            color: var(--muted);
            font-style: italic;
            padding: 16px 12px;
            text-align: center;
            border: 2px dashed var(--border);
            border-radius: 14px;
            margin-bottom: 4px;
            background: var(--card-2);
        }

        /* BANK PAGE */
        .bank-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.9rem; font-weight: 700;
            text-align: center;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--sky), var(--mint));
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
        }
        .bank-sub {
            text-align: center; font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 20px;
            letter-spacing: 0.03em;
        }

        .btn-add-bank-subject {
            background: linear-gradient(135deg, #e0f9ff, #e8f0ff);
            border: 2.5px dashed var(--sky);
            border-radius: 18px;
            padding: 16px;
            font-size: 0.95rem; font-weight: 700;
            color: #0a6b8a;
            cursor: pointer;
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.18s ease;
            margin-bottom: 18px;
            letter-spacing: 0.02em;
        }
        .btn-add-bank-subject:hover {
            background: linear-gradient(135deg, #c8f0ff, #d8e4ff);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(77,201,255,0.2);
        }

        .bank-subject-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 0 rgba(77,201,255,0.08);
        }
        .bank-subject-header {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 2px dashed var(--border);
        }
        .bank-subject-name-input {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.15rem; font-weight: 600;
            color: var(--sky);
            background: transparent;
            border: 1.5px solid transparent;
            border-radius: 10px;
            padding: 6px 10px;
            flex: 1;
            min-width: 100px;
            transition: 0.15s;
        }
        .bank-subject-name-input:hover { border-color: var(--border); }
        .bank-subject-name-input:focus {
            outline: none;
            border-color: var(--sky);
            background: #f0faff;
        }

        .bank-item {
            display: flex; align-items: center; gap: 10px;
            background: var(--card-2);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1.5px solid var(--border);
            transition: all 0.15s;
        }
        .bank-item:hover { border-color: var(--sky); }
        .bank-task-input {
            flex: 1;
            font-size: 0.92rem; font-weight: 500;
            color: var(--text);
            background: transparent;
            border: none;
            border-bottom: 1.5px solid transparent;
            padding: 4px 2px;
            font-family: inherit;
            min-width: 0;
        }
        .bank-task-input:focus {
            outline: none;
            border-bottom-color: var(--sky);
        }

        .bank-add-row {
            display: flex; gap: 8px;
            margin-top: 10px;
            background: var(--card-2);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 8px;
        }
        .bank-add-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.92rem;
            font-family: inherit;
            padding: 6px 8px;
        }
        .bank-add-row input:focus { outline: none; }
        .bank-add-row input::placeholder { color: var(--muted); }
        .bank-add-row button {
            background: linear-gradient(135deg, var(--sky), #2a9bc0);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.88rem;
            color: #fff;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            flex-shrink: 0;
            transition: all 0.15s ease;
            box-shadow: 0 3px 0 rgba(42,155,192,0.4);
        }
        .bank-add-row button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 0 rgba(42,155,192,0.4), 0 4px 12px rgba(77,201,255,0.4);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(61,30,92,0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 10001;
            padding: 16px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-box {
            background: #fff;
            border: 2px solid var(--pink);
            border-radius: 24px;
            padding: 22px;
            max-width: 460px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(255,95,162,0.3), 0 20px 60px rgba(61,30,92,0.2);
        }
        .modal-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1.35rem;
            color: var(--text);
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: -0.01em;
        }
        .modal-item {
            display: block; width: 100%;
            text-align: left;
            background: var(--card-2);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.15s ease;
            font-weight: 500;
        }
        .modal-item:hover {
            background: #fff0f8;
            border-color: var(--pink);
            transform: translateX(3px);
        }
        .modal-item.special {
            background: linear-gradient(135deg, #e8fff4, #e0f9ff);
            border-color: var(--mint);
            color: #0a8055;
            font-weight: 700;
        }
        .modal-item.special:hover {
            background: linear-gradient(135deg, #d4ffe8, #c8f0ff);
            border-color: var(--mint);
        }
        .modal-empty {
            text-align: center;
            color: var(--muted);
            padding: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .modal-cancel {
            display: block; width: 100%;
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--muted);
            cursor: pointer;
            margin-top: 8px;
            font-family: inherit;
            transition: all 0.15s ease;
        }
        .modal-cancel:hover {
            background: var(--card-2);
            color: var(--text);
            border-color: var(--pink);
        }

        /* CELEBRATIONS */
        .celebration-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; visibility: hidden;
        }
        .celebration-overlay.active { visibility: visible; animation: popFade 1.8s ease forwards; }
        .confetti-burst {
            font-size: 5rem;
            filter: drop-shadow(0 0 30px rgba(255,95,162,0.6));
            animation: floatUp 1.6s ease-out;
            display: flex; gap: 16px; flex-wrap: wrap;
            justify-content: center; align-items: center;
        }
        @keyframes popFade {
            0% { opacity: 0; transform: scale(0.7); }
            20% { opacity: 1; transform: scale(1.1); }
            40% { transform: scale(1); }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        @keyframes floatUp {
            0% { transform: translateY(30px) rotate(-5deg); opacity: 0; }
            20% { opacity: 1; transform: translateY(-10px) rotate(5deg); }
            60% { transform: translateY(-30px) rotate(-3deg); }
            100% { transform: translateY(-80px) rotate(10deg); opacity: 0; }
        }

        .full-day-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,95,162,0.92), rgba(181,122,255,0.95));
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; visibility: hidden; pointer-events: none;
            text-align: center; padding: 20px;
        }
        .full-day-overlay.active { visibility: visible; animation: fullDayAnim 3.2s ease forwards; }
        @keyframes fullDayAnim {
            0% { opacity: 0; transform: scale(0.6); }
            15% { opacity: 1; transform: scale(1.05); }
            25% { transform: scale(1); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.15); }
        }
        .full-day-overlay .big-emoji {
            font-size: 7rem;
            animation: bounceBig 0.8s ease infinite alternate;
            filter: drop-shadow(0 0 40px rgba(255,210,63,0.8));
        }
        @keyframes bounceBig {
            from { transform: translateY(0) rotate(-8deg) scale(1); }
            to { transform: translateY(-22px) rotate(8deg) scale(1.08); }
        }
        .full-day-overlay .msg {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.8rem; font-weight: 700;
            letter-spacing: -0.01em;
            color: #fff;
            margin: 16px 0 12px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.2), 0 0 30px rgba(255,210,63,0.6);
        }
        .full-day-overlay .sub-msg {
            font-size: 1.15rem; font-weight: 600;
            color: var(--text);
            background: #fff;
            padding: 12px 26px;
            border-radius: 40px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            letter-spacing: 0.02em;
        }

        .footer-note {
            position: relative; z-index: 1;
            margin-top: 24px;
            font-size: 0.78rem;
            color: var(--muted);
            text-align: center;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.9rem; }
            .day-title { font-size: 1.6rem; }
            .bank-title { font-size: 1.5rem; }
            .nav-btn { padding: 8px 12px; font-size: 0.75rem; }
            .full-day-overlay .msg { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>✨ Study Glow</h1>
        <div class="subhead">
            <span class="dot"></span>
            <span>Plan · Do · Celebrate</span>
            <span class="dot"></span>
        </div>
    </div>

    <div class="page-nav" id="pageNav"></div>
    <div class="page-content" id="pageContent"></div>

    <div class="footer-note">✦ Each subject has its own task bank · Everything saves automatically ✦</div>

    <div class="celebration-overlay" id="celebration">
        <div class="confetti-burst" id="confettiBurst">🎉🎊🥳✨🎈</div>
    </div>
    <div class="full-day-overlay" id="fullDayOverlay">
        <div class="big-emoji" id="fullDayEmoji">🏆</div>
        <div class="msg" id="fullDayMsg">PERFECT DAY</div>
        <div class="sub-msg" id="fullDaySubMsg">All tasks complete!</div>
    </div>

    <script>
    (function() {
        'use strict';

        const DAYS = [
            { name: 'Monday', emoji: '🌸' }, { name: 'Tuesday', emoji: '🔥' },
            { name: 'Wednesday', emoji: '⚡' }, { name: 'Thursday', emoji: '🌊' },
            { name: 'Friday', emoji: '✨' }, { name: 'Saturday', emoji: '🎮' },
            { name: 'Sunday', emoji: '🎧' }
        ];

        let subjectBank = [];
        let days = [];
        let nextId = 1;
        function genId() { return 'id_' + (nextId++) + '_' + Math.random().toString(36).slice(2,7); }

        const STORAGE_KEY = 'weeklyTodo_v7_teen';

        function saveToStorage() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ subjectBank, days, nextId })); } catch(e) {}
        }
        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data && Array.isArray(data.subjectBank) && Array.isArray(data.days) && data.days.length === 7) {
                    subjectBank = data.subjectBank;
                    days = data.days;
                    nextId = data.nextId || 1;
                    for (let d = 0; d < 7; d++) if (!Array.isArray(days[d])) days[d] = [];
                }
            } catch(e) {}
        }

        // ---- sounds ----
        function playBeep(freq, duration, type, vol) {
            freq = freq || 880; duration = duration || 0.1; type = type || 'sine'; vol = vol || 0.15;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.value = freq; gain.gain.value = vol;
                osc.connect(gain); gain.connect(ctx.destination); osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }
        function playCelebrationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach(function(freq, i) {
                    const osc = ctx.createOscillator(); const g = ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    g.gain.setValueAtTime(0.12, now + i * 0.09);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.4);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.4);
                });
            } catch(e) {}
        }
        function playFanfare() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const now = ctx.currentTime;
                [[523.25,0],[523.25,0.15],[523.25,0.30],[659.25,0.45],[783.99,0.60],[1046.50,0.85],[1046.50,1.05],[1318.51,1.20]]
                .forEach(function(pair) {
                    const freq = pair[0], t = pair[1];
                    const osc = ctx.createOscillator(); const g = ctx.createGain();
                    osc.type = 'triangle'; osc.frequency.value = freq;
                    g.gain.setValueAtTime(0.14, now + t);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.5);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(now + t); osc.stop(now + t + 0.5);
                });
            } catch(e) {}
        }

        // ---- celebrations ----
        const celebrationOverlay = document.getElementById('celebration');
        const confettiBurst = document.getElementById('confettiBurst');
        const fullDayOverlay = document.getElementById('fullDayOverlay');
        const fullDayEmoji = document.getElementById('fullDayEmoji');
        const fullDayMsg = document.getElementById('fullDayMsg');
        const fullDaySubMsg = document.getElementById('fullDaySubMsg');

        function celebrate() {
            playCelebrationSound();
            const emojis = ['🎉','🎊','🥳','✨','🎈','🌟','💖','⭐','🔥','💯','⚡','🦄'];
            let html = '';
            for (let i = 0; i < 12; i++) html += emojis[Math.floor(Math.random() * emojis.length)];
            confettiBurst.textContent = html;
            celebrationOverlay.classList.remove('active');
            void celebrationOverlay.offsetWidth;
            celebrationOverlay.classList.add('active');
            playBeep(1200, 0.08, 'sine');
            setTimeout(function() { celebrationOverlay.classList.remove('active'); }, 1800);
        }
        const fullDayRewards = [
            { emoji: '🏆', msg: 'PERFECT DAY', sub: 'All tasks crushed! 💪' },
            { emoji: '🔥', msg: 'ON FIRE', sub: 'Every single task done!' },
            { emoji: '⚡', msg: 'LIGHTNING', sub: 'You powered through!' },
            { emoji: '💯', msg: 'FULL MARKS', sub: 'Nothing left behind!' },
            { emoji: '👑', msg: 'DAY CHAMPION', sub: 'You ran this day!' }
        ];
        function celebrateFullDay() {
            playFanfare();
            const r = fullDayRewards[Math.floor(Math.random() * fullDayRewards.length)];
            fullDayEmoji.textContent = r.emoji;
            fullDayMsg.textContent = r.msg;
            fullDaySubMsg.textContent = r.sub;
            fullDayOverlay.classList.remove('active');
            void fullDayOverlay.offsetWidth;
            fullDayOverlay.classList.add('active');
            setTimeout(function() { fullDayOverlay.classList.remove('active'); }, 3200);
        }

        // ---- nav ----
        let currentPage = 'day0';
        const pageNav = document.getElementById('pageNav');
        const pageContent = document.getElementById('pageContent');

        function renderNav() {
            pageNav.innerHTML = '';
            DAYS.forEach(function(day, idx) {
                const btn = document.createElement('button');
                btn.className = 'nav-btn' + (currentPage === 'day' + idx ? ' active' : '');
                btn.innerHTML = day.emoji + ' ' + day.name;
                btn.addEventListener('click', function() { goToPage('day' + idx); });
                pageNav.appendChild(btn);
            });
            const bankBtn = document.createElement('button');
            bankBtn.className = 'nav-btn bank-btn' + (currentPage === 'bank' ? ' active' : '');
            bankBtn.innerHTML = '📚 Task Banks';
            bankBtn.addEventListener('click', function() { goToPage('bank'); });
            pageNav.appendChild(bankBtn);
        }

        function goToPage(pageId) {
            currentPage = pageId;
            renderNav();
            renderPage();
            playBeep(600, 0.05, 'sine', 0.08);
        }

        function renderPage() {
            pageContent.innerHTML = '';
            if (currentPage === 'bank') {
                pageContent.appendChild(renderBankPage());
            } else {
                const dayIdx = parseInt(currentPage.replace('day', ''), 10);
                pageContent.appendChild(renderDayPage(dayIdx));
            }
        }

        // ---- DAY PAGE ----
        function renderDayPage(dayIdx) {
            const wrap = document.createElement('div');
            const day = DAYS[dayIdx];

            const title = document.createElement('div');
            title.className = 'day-title';
            title.textContent = day.emoji + ' ' + day.name;
            wrap.appendChild(title);

            const prog = document.createElement('div');
            prog.className = 'day-progress';
            prog.id = 'day-progress-' + dayIdx;
            wrap.appendChild(prog);

            if (days[dayIdx].length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No subjects yet. Tap "＋ Add Subject" below to get started.';
                wrap.appendChild(hint);
            } else {
                days[dayIdx].forEach(function(daySubject, subjIdx) {
                    wrap.appendChild(renderSubjectBlock(dayIdx, subjIdx, daySubject));
                });
            }

            const addSubjBtn = document.createElement('button');
            addSubjBtn.type = 'button';
            addSubjBtn.className = 'btn-add-subject';
            addSubjBtn.textContent = '＋ Add Subject';
            addSubjBtn.addEventListener('click', function() { openSubjectPicker(dayIdx); });
            wrap.appendChild(addSubjBtn);

            setTimeout(function() { updateDayProgress(dayIdx); }, 0);
            return wrap;
        }

        function renderSubjectBlock(dayIdx, subjIdx, daySubject) {
            const block = document.createElement('div');
            block.className = 'subject-block';

            const bankSubj = subjectBank.find(function(s) { return s.id === daySubject.bankSubjectId; });
            const displayName = bankSubj ? bankSubj.name : 'Unknown subject';

            const header = document.createElement('div');
            header.className = 'subject-header';

            const nameEl = document.createElement('div');
            nameEl.className = 'subject-name-display';
            nameEl.textContent = displayName;
            header.appendChild(nameEl);

            const removeSubjBtn = document.createElement('button');
            removeSubjBtn.type = 'button';
            removeSubjBtn.className = 'btn-icon';
            removeSubjBtn.textContent = '✕';
            removeSubjBtn.title = 'Remove subject from this day';
            removeSubjBtn.addEventListener('click', function() {
                if (confirm('Remove "' + displayName + '" from ' + DAYS[dayIdx].name + '?')) {
                    days[dayIdx].splice(subjIdx, 1);
                    saveToStorage();
                    renderPage();
                    playBeep(500, 0.1, 'sawtooth');
                }
            });
            header.appendChild(removeSubjBtn);
            block.appendChild(header);

            const taskList = document.createElement('div');
            taskList.className = 'task-list';

            if (daySubject.tasks.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No tasks yet — add some from the bank below';
                taskList.appendChild(hint);
            } else {
                daySubject.tasks.forEach(function(task, taskIdx) {
                    taskList.appendChild(renderTaskItem(dayIdx, subjIdx, taskIdx, task));
                });
            }
            block.appendChild(taskList);

            const addTaskBtn = document.createElement('button');
            addTaskBtn.type = 'button';
            addTaskBtn.className = 'btn-add-task';
            if (!bankSubj || bankSubj.tasks.length === 0) {
                addTaskBtn.disabled = true;
                addTaskBtn.textContent = '＋ Add task · bank is empty';
            } else {
                addTaskBtn.textContent = '＋ Add task from bank';
                addTaskBtn.addEventListener('click', function() {
                    openTaskPicker(dayIdx, subjIdx, bankSubj);
                });
            }
            block.appendChild(addTaskBtn);

            return block;
        }

        function renderTaskItem(dayIdx, subjIdx, taskIdx, task) {
            const item = document.createElement('div');
            item.className = 'task-item' + (task.done ? ' done' : '');

            const text = document.createElement('div');
            text.className = 'task-text-display';
            text.textContent = task.text;
            item.appendChild(text);

            const checkBtn = document.createElement('button');
            checkBtn.type = 'button';
            checkBtn.className = 'task-check' + (task.done ? ' done' : '');
            checkBtn.textContent = task.done ? '✓' : '';
            checkBtn.addEventListener('click', function() {
                task.done = !task.done;
                saveToStorage();
                if (task.done) { playBeep(880, 0.1, 'sine'); celebrate(); }
                else { playBeep(400, 0.1, 'sine'); }
                renderPage();
            });
            item.appendChild(checkBtn);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'task-remove';
            removeBtn.textContent = '✕';
            removeBtn.title = 'Remove task';
            removeBtn.addEventListener('click', function() {
                days[dayIdx][subjIdx].tasks.splice(taskIdx, 1);
                saveToStorage();
                renderPage();
                playBeep(500, 0.08, 'sawtooth');
            });
            item.appendChild(removeBtn);

            return item;
        }

        function updateDayProgress(dayIdx) {
            const prog = document.getElementById('day-progress-' + dayIdx);
            if (!prog) return;
            let total = 0, done = 0;
            days[dayIdx].forEach(function(subj) {
                subj.tasks.forEach(function(t) { total++; if (t.done) done++; });
            });
            if (total === 0) { prog.textContent = 'No tasks yet'; prog.classList.remove('complete'); return; }
            if (done === total) {
                prog.classList.add('complete');
                prog.textContent = '🏆 ' + done + '/' + total + ' — COMPLETE';
                celebrateFullDay();
            } else {
                prog.classList.remove('complete');
                prog.textContent = done + ' / ' + total + ' tasks done';
            }
        }

        // ---- SUBJECT PICKER ----
        function openSubjectPicker(dayIdx) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const box = document.createElement('div');
            box.className = 'modal-box';

            const h = document.createElement('div');
            h.className = 'modal-title';
            h.textContent = 'Pick a subject for ' + DAYS[dayIdx].name;
            box.appendChild(h);

            if (subjectBank.length === 0) {
                const e = document.createElement('div');
                e.className = 'modal-empty';
                e.textContent = 'Your bank is empty. Create your first subject below, or go to 📚 Task Banks first.';
                box.appendChild(e);
            } else {
                subjectBank.forEach(function(bs) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'modal-item';
                    btn.textContent = bs.name + (bs.tasks.length ? '  ·  ' + bs.tasks.length + ' tasks' : '  ·  no tasks yet');
                    btn.addEventListener('click', function() {
                        addDaySubject(dayIdx, bs.id);
                        document.body.removeChild(overlay);
                    });
                    box.appendChild(btn);
                });
            }

            const createBtn = document.createElement('button');
            createBtn.type = 'button';
            createBtn.className = 'modal-item special';
            createBtn.textContent = '✦ Create a new subject';
            createBtn.addEventListener('click', function() {
                const name = prompt('New subject name (e.g. Math, Art, Quran):');
                if (!name || !name.trim()) return;
                const bs = { id: genId(), name: name.trim(), tasks: [] };
                subjectBank.push(bs);
                addDaySubject(dayIdx, bs.id);
                saveToStorage();
                document.body.removeChild(overlay);
                renderPage();
                playBeep(800, 0.1, 'sine');
            });
            box.appendChild(createBtn);

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'modal-cancel';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', function() { document.body.removeChild(overlay); });
            box.appendChild(cancelBtn);

            overlay.appendChild(box);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) document.body.removeChild(overlay); });
            document.body.appendChild(overlay);
        }

        function addDaySubject(dayIdx, bankSubjectId) {
            days[dayIdx].push({ id: genId(), bankSubjectId: bankSubjectId, tasks: [] });
            saveToStorage();
            renderPage();
            playBeep(800, 0.1, 'sine');
        }

        // ---- TASK PICKER ----
        function openTaskPicker(dayIdx, subjIdx, bankSubj) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            const box = document.createElement('div');
            box.className = 'modal-box';

            const h = document.createElement('div');
            h.className = 'modal-title';
            h.textContent = '＋ Add task to ' + bankSubj.name;
            box.appendChild(h);

            if (bankSubj.tasks.length === 0) {
                const e = document.createElement('div');
                e.className = 'modal-empty';
                e.textContent = 'This subject has no tasks in its bank yet. Go to 📚 Task Banks to add some first.';
                box.appendChild(e);
            } else {
                bankSubj.tasks.forEach(function(task) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'modal-item';
                    btn.textContent = task.text;
                    btn.addEventListener('click', function() {
                        days[dayIdx][subjIdx].tasks.push({ id: genId(), text: task.text, done: false });
                        saveToStorage();
                        document.body.removeChild(overlay);
                        renderPage();
                        playBeep(900, 0.08, 'sine');
                    });
                    box.appendChild(btn);
                });
            }

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button';
            cancelBtn.className = 'modal-cancel';
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', function() { document.body.removeChild(overlay); });
            box.appendChild(cancelBtn);

            overlay.appendChild(box);
            overlay.addEventListener('click', function(e) { if (e.target === overlay) document.body.removeChild(overlay); });
            document.body.appendChild(overlay);
        }

        // ---- BANK PAGE ----
        function renderBankPage() {
            const wrap = document.createElement('div');

            const title = document.createElement('div');
            title.className = 'bank-title';
            title.textContent = '📚 Task Banks';
            wrap.appendChild(title);

            const sub = document.createElement('div');
            sub.className = 'bank-sub';
            sub.textContent = 'One bank per subject · days pull from these lists';
            wrap.appendChild(sub);

            const addBankSubjBtn = document.createElement('button');
            addBankSubjBtn.type = 'button';
            addBankSubjBtn.className = 'btn-add-bank-subject';
            addBankSubjBtn.textContent = '＋ Add new subject to bank';
            addBankSubjBtn.addEventListener('click', function() {
                const name = prompt('New subject name (e.g. Math, Art, Quran):');
                if (!name || !name.trim()) return;
                subjectBank.push({ id: genId(), name: name.trim(), tasks: [] });
                saveToStorage();
                renderPage();
                playBeep(800, 0.1, 'sine');
            });
            wrap.appendChild(addBankSubjBtn);

            if (subjectBank.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.style.padding = '30px';
                hint.textContent = 'No subjects yet. Add your first subject above!';
                wrap.appendChild(hint);
            } else {
                subjectBank.forEach(function(bs, bsIdx) {
                    wrap.appendChild(renderBankSubjectCard(bs, bsIdx));
                });
            }
            return wrap;
        }

        function renderBankSubjectCard(bs, bsIdx) {
            const card = document.createElement('div');
            card.className = 'bank-subject-card';

            const header = document.createElement('div');
            header.className = 'bank-subject-header';

            const nameInput = document.createElement('input');
            nameInput.className = 'bank-subject-name-input';
            nameInput.type = 'text';
            nameInput.value = bs.name;
            nameInput.addEventListener('input', function(e) {
                bs.name = e.target.value;
                saveToStorage();
            });
            header.appendChild(nameInput);

            const removeSubjBtn = document.createElement('button');
            removeSubjBtn.type = 'button';
            removeSubjBtn.className = 'btn-icon';
            removeSubjBtn.textContent = '✕';
            removeSubjBtn.title = 'Delete this subject from the bank';
            removeSubjBtn.addEventListener('click', function() {
                if (confirm('Delete "' + bs.name + '" and all its tasks?\n\nDays using it will show as "Unknown subject".')) {
                    subjectBank.splice(bsIdx, 1);
                    saveToStorage();
                    renderPage();
                    playBeep(500, 0.1, 'sawtooth');
                }
            });
            header.appendChild(removeSubjBtn);
            card.appendChild(header);

            if (bs.tasks.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'No tasks in this bank — add one below.';
                card.appendChild(hint);
            } else {
                bs.tasks.forEach(function(task, taskIdx) {
                    const item = document.createElement('div');
                    item.className = 'bank-item';

                    const text = document.createElement('input');
                    text.className = 'bank-task-input';
                    text.type = 'text';
                    text.value = task.text;
                    text.addEventListener('input', function(e) { task.text = e.target.value; saveToStorage(); });
                    item.appendChild(text);

                    const removeBtn = document.createElement('button');
                    removeBtn.type = 'button';
                    removeBtn.className = 'task-remove';
                    removeBtn.textContent = '✕';
                    removeBtn.addEventListener('click', function() {
                        bs.tasks.splice(taskIdx, 1);
                        saveToStorage();
                        renderPage();
                        playBeep(500, 0.08, 'sawtooth');
                    });
                    item.appendChild(removeBtn);
                    card.appendChild(item);
                });
            }

            const addRow = document.createElement('div');
            addRow.className = 'bank-add-row';
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.placeholder = 'New task for ' + (bs.name || 'this subject') + '…';
            addRow.appendChild(newInput);
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.textContent = 'Add';
            addBtn.addEventListener('click', function() {
                const val = newInput.value.trim();
                if (!val) return;
                bs.tasks.push({ id: genId(), text: val });
                saveToStorage();
                renderPage();
                playBeep(800, 0.08, 'sine');
            });
            newInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') addBtn.click(); });
            addRow.appendChild(addBtn);
            card.appendChild(addRow);

            return card;
        }

        // ---- INIT ----
        loadFromStorage();

        if (subjectBank.length === 0 && days.length === 7 && days.every(function(d) { return d.length === 0; })) {
            const seed = [
                { name: 'Math', tasks: ['Times tables practice', 'Homework page'] },
                { name: 'English', tasks: ['Read 20 minutes', 'Spelling practice'] },
                { name: 'Science', tasks: ['Read chapter', 'Watch a video'] },
                { name: 'Art', tasks: ['Sketch something fun'] },
                { name: 'Music', tasks: ['Practice instrument 15 min'] }
            ];
            seed.forEach(function(s) {
                subjectBank.push({
                    id: genId(),
                    name: s.name,
                    tasks: s.tasks.map(function(t) { return { id: genId(), text: t }; })
                });
            });
            saveToStorage();
        }

        if (days.length !== 7) {
            const fresh = [];
            for (let i = 0; i < 7; i++) fresh.push(Array.isArray(days[i]) ? days[i] : []);
            days = fresh;
        }

        renderNav();
        renderPage();

        window.addEventListener('beforeunload', saveToStorage);

        let welcomed = false;
        document.body.addEventListener('click', function() {
            if (!welcomed) { playBeep(660, 0.08, 'sine'); welcomed = true; }
        }, { once: false });
    })();
    </script>
</body>
</html>
